experiment:
  name: so101_remote_teleop_tcp
  mode: remote_teleoperation
  task_name: teleop_so101
  save_dir: runs/so101_remote_teleop_tcp

robot:
  type: so101_follower
  port: /dev/ttyACM0
  id: follower_arm
  calibration_dir: calibrations/robots/so_follower

teleop:
  enabled: true
  type: so101_leader
  port: /dev/ttyACM0
  id: leader_arm
  calibration_dir: calibrations/teleoperators/so_leader

model:
  type: mock
  model_path: ""
  device: cpu
  dtype: float32
  action_horizon: 1
  inference_frequency: 30

camera:
  enabled: false
  fps: 30
  cameras:

network:
  protocol: tcp
  server_host: 192.168.1.151
  server_port: 9001
  timeout_ms: 200
  reconnect: true
  max_packet_size_mb: 4

runtime:
  control_frequency: 50
  observation_frequency: 50
  action_send_frequency: 50
  safety_stop_on_timeout: true
  hold_last_action_on_timeout: true

safety:
  max_action_delta: 2.0
  max_first_action_delta: 25.0
  action_min: -180
  action_max: 180
  require_action_keys_match: true

webui:
  enabled: true
  host: 0.0.0.0
  port: 7861
  show_images: false
  show_joint_states: true
  show_latency: true
  show_actions: true

logging:
  save_video: false
  save_metrics: true
  save_observations: false
  save_actions: true
  log_level: info
